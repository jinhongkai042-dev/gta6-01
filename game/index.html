<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marlin Bay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: radial-gradient(circle at 50% 18%, #152b40 0%, #09131e 72%);
      color: #e8f4f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      background: #102436;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(120, 220, 232, 0.16);
    }

    #game {
      display: block;
      width: 1280px;
      height: 720px;
      background: #14334b;
    }

    #ui-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #ui-overlay.is-visible {
      display: flex;
      pointer-events: auto;
    }

    .controls-bar {
      width: 1280px;
      max-width: 100vw;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: #a9c7d9;
      background: rgba(9, 20, 32, 0.72);
      border: 1px solid rgba(114, 214, 228, 0.16);
      border-radius: 6px;
    }

    .controls-bar strong {
      color: #ffd166;
      font-weight: 700;
    }

    .controls-bar .sep {
      color: rgba(169, 199, 217, 0.35);
    }

    @media (max-width: 1280px) and (max-height: 720px) {
      html, body {
        justify-content: flex-start;
        gap: 0;
        overflow: hidden;
        background: #09131e;
      }

      #stage {
        border-radius: 0;
        box-shadow: none;
      }

      .controls-bar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="ui-overlay" aria-live="polite"></div>
  </div>
  <div class="controls-bar" role="note" aria-label="Controls">
    <span><strong>WASD / Arrows</strong> Move &amp; Drive</span>
    <span class="sep">&middot;</span>
    <span><strong>E</strong> Enter / Exit Car</span>
    <span class="sep">&middot;</span>
    <span><strong>Space</strong> Handbrake</span>
    <span class="sep">&middot;</span>
    <span><strong>F</strong> Attack</span>
    <span class="sep">&middot;</span>
    <span><strong>M</strong> Missions</span>
    <span class="sep">&middot;</span>
    <span><strong>P</strong> Pause</span>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
