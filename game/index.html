<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marlin Bay</title>
  <style>
    :root {
      --bg-deep: #071926;
      --bg-mid: #0d2b3e;
      --panel: rgba(9, 24, 38, 0.88);
      --border: rgba(114, 224, 232, 0.24);
      --text: #eef6fa;
      --muted: #98b8c9;
      --accent: #ff7a59;
      --aqua: #36d6cf;
      --gold: #ffd166;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at 20% 0%, #14465e 0%, var(--bg-deep) 58%),
        linear-gradient(180deg, var(--bg-mid), var(--bg-deep));
      color: var(--text);
      font-family: 'Avenir Next', 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    #game-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px;
      max-width: 100vw;
    }

    #stage {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      background: #0d7c98;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.55),
        0 0 0 1px var(--border);
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: auto;
    }

    #ui-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px 18px;
      width: 1280px;
      max-width: 100%;
      padding: 9px 16px;
      border-radius: 9px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.02em;
    }

    .controls-bar .brand {
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-right: 4px;
    }

    .controls-bar .ctrl-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .controls-bar kbd {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 700;
    }

    @media (max-height: 760px) {
      #game-shell {
        padding: 0;
        gap: 0;
      }

      #stage {
        border-radius: 0;
        box-shadow: none;
      }

      .controls-bar {
        border-radius: 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body>
  <main id="game-shell">
    <div id="stage">
      <canvas id="game" width="1280" height="720"></canvas>
      <div id="ui-overlay" aria-live="polite"></div>
    </div>
    <footer class="controls-bar" aria-label="Game controls">
      <span class="brand">Marlin Bay</span>
      <span class="ctrl-item"><kbd>WASD</kbd> / <kbd>Arrows</kbd> Move &amp; Drive</span>
      <span class="ctrl-item"><kbd>E</kbd> Enter / Exit Car</span>
      <span class="ctrl-item"><kbd>F</kbd> Attack</span>
      <span class="ctrl-item"><kbd>Space</kbd> Handbrake</span>
      <span class="ctrl-item"><kbd>P</kbd> Pause</span>
      <span class="ctrl-item"><kbd>M</kbd> Missions</span>
    </footer>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
